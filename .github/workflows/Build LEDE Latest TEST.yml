name: Build LEDE Latest TEST
on:
  workflow_dispatch:

# [优化]: 并发控制，自动取消排队或正在运行的旧任务，节省运算时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  UPLOAD_BIN_DIR: "false"
  UPLOAD_FIRMWARE: "true"
  UPLOAD_RELEASE: "true"
  # CCACHE 统一挂载路径
  CCACHE_DIR: "/home/runner/.ccache"
  # [修复 Node20 警告] 强制所有底层 Action 使用 Node.js 24 运行
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    #[优化]: 全局超时熔断，防止编译死锁耗尽 GitHub 免费额度 (5小时)
    timeout-minutes: 300 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 释放 GitHub Runner 的磁盘空间，OpenWrt 编译通常需要 30GB+ 空间
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          
          # 正常更新软件源
          sudo apt-get update
          
          # Ubuntu 24.04 专属包名修正：7zip, libgmp-dev, python3-setuptools
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake device-tree-compiler \
            flex gawk gcc-multilib g++-multilib gettext git gperf \
            help2man intltool libelf-dev libglib2.0-dev \
            libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev \
            ninja-build 7zip patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            bzip2 curl genisoimage haveged ccache libc6-dev-i386
            
          sudo apt-get autoremove --purge -y
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"
          
      - name: Clone Source Code
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # 仅拉取单分支、最新一次 commit，极大减少 git clone 时间
          git clone -b $REPO_BRANCH --single-branch --depth 1 $REPO_URL openwrt

      - name: Generate Cache Key Variables & Set Version
        id: cache-vars
        run: |
          set -euo pipefail
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          
          # 【全局锁定版本号】：例如 R26.05.07
          VERSION_TAG="R$(date +%y.%m.%d)"
          echo "TAG_VERSION=${VERSION_TAG}" >> $GITHUB_ENV
          echo "CURRENT_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "🚀 锁定的版本号为: ${VERSION_TAG}"

      # 【企业级缓存策略】
      # 缓存键由 分支名 + 核心配置文件的 Hash + 日期 组成。
      - name: Cache Ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-lede-${{ env.REPO_BRANCH }}-${{ hashFiles('.github/workflows/*.yml', 'diy-part1.sh', 'diy-part2.sh', 'openwrt/feeds.conf.default') }}-${{ steps.cache-vars.outputs.date }}
          restore-keys: |
            ccache-lede-${{ env.REPO_BRANCH }}-${{ hashFiles('.github/workflows/*.yml', 'diy-part1.sh', 'diy-part2.sh', 'openwrt/feeds.conf.default') }}-
            ccache-lede-${{ env.REPO_BRANCH }}-

      # 【企业级优化】：缓存下载好的源码包，但利用 ! 语法精准剔除 Go 语言的剧毒缓存库
      - name: Cache Downloaded Sources (DL)
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/openwrt/dl
            !${{ github.workspace }}/openwrt/dl/go-mod-cache
          key: dl-lede-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            dl-lede-${{ env.REPO_BRANCH }}-

      - name: Load Custom Feeds (DIY Part 1)
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -euo pipefail
          SCRIPT="${{ github.workspace }}/diy-part1.sh"
          [[ -f "$SCRIPT" ]] && bash "$SCRIPT" || true

      - name: Update, Patch & Install Feeds
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          log_i(){ echo -e "\e[32m[INFO] $1\e[0m"; }
          log_w(){ echo -e "\e[33m[WARN] $1\e[0m"; }
          log_e(){ echo -e "\e[31m[ERR ] $1\e[0m"; exit 1; }

          retry() {
              local n=3
              for i in $(seq 1 $n); do
                  if "$@"; then return 0; fi
                  log_w "命令失败，重试 $i/$n: $*"
                  sleep 5
              done
              log_e "命令失败已达最大重试次数: $*"
          }

          # --------------------------------------------------------------------------
          # [类 1]: 底层依赖包 (绝对不碰 feeds/，保留官方大社区最新源兜底)
          # --------------------------------------------------------------------------
          DEP_PKGS=(
              xray-core v2ray-geodata sing-box chinadns-ng dns2socks hysteria
              ipt2socks microsocks naiveproxy shadowsocks-libev shadowsocks-rust
              shadowsocksr-libev simple-obfs tcping trojan-plus tuic-client
              v2ray-plugin xray-plugin geoview shadow-tls
              smartdns luci-app-smartdns
              luci-theme-argon luci-app-argon-config
          )
          
          # --------------------------------------------------------------------------
          # [类 2]: UI 主程序 (必须从 package/ 和 feeds/ 里双重删光，确立新版 UI 唯一性)
          # --------------------------------------------------------------------------
          UI_PKGS=(
              luci-app-passwall passwall luci-app-passwall2
          )

          log_i "1. 更新 feeds"
          retry ./scripts/feeds update -a

          log_i "2. 扫荡本地硬编码老旧依赖包..."
          for pkg in "${DEP_PKGS[@]}"; do
              safe_pkg=$(printf '%s\n' "$pkg" | sed 's/[][\\.*^$()+?{}\|]/\\&/g')
              while IFS= read -r -d '' dir; do rm -rf "$dir"; done < <(find package/ -type d -name "$pkg" -print0 2>/dev/null || true)
              while IFS= read -r -d '' makefile; do
                  if grep -q -E "^[[:space:]]*PKG_NAME[[:space:]]*:?=[[:space:]]*${safe_pkg}[[:space:]]*$" "$makefile" 2>/dev/null; then
                      rm -rf "$(dirname "$makefile")"
                  fi
              done < <(find package/ -type f -name "Makefile" -print0 2>/dev/null || true)
          done

          log_i "3. 彻底绞杀旧版 Passwall UI..."
          for pkg in "${UI_PKGS[@]}"; do
              safe_pkg=$(printf '%s\n' "$pkg" | sed 's/[][\\.*^$()+?{}\|]/\\&/g')

              while IFS= read -r -d '' dir; do rm -rf "$dir"; done < <(find package/ -type d -name "$pkg" -print0 2>/dev/null || true)
              while IFS= read -r -d '' makefile; do
                  if grep -q -E "^[[:space:]]*PKG_NAME[[:space:]]*:?=[[:space:]]*${safe_pkg}[[:space:]]*$" "$makefile" 2>/dev/null; then
                      rm -rf "$(dirname "$makefile")"
                  fi
              done < <(find package/ -type f -name "Makefile" -print0 2>/dev/null || true)

              while IFS= read -r -d '' dir; do
                  if [[ "$dir" == *passwall_packages* ]] || [[ "$dir" == *passwall_luci* ]]; then continue; fi
                  rm -rf "$dir"
              done < <(find feeds/ -type d -name "$pkg" -print0 2>/dev/null || true)
              while IFS= read -r -d '' makefile; do
                  if [[ "$makefile" == *passwall_packages* ]] || [[ "$makefile" == *passwall_luci* ]]; then continue; fi
                  if grep -q -E "^[[:space:]]*PKG_NAME[[:space:]]*:?=[[:space:]]*${safe_pkg}[[:space:]]*$" "$makefile" 2>/dev/null; then
                      rm -rf "$(dirname "$makefile")"
                  fi
              done < <(find feeds/ -type f -name "Makefile" -print0 2>/dev/null || true)
          done

          log_i "4. 克隆社区专属插件..."
          mkdir -p package/community
          retry git clone --depth 1 https://github.com/pymumu/openwrt-smartdns.git package/smartdns
          retry git clone --depth 1 https://github.com/pymumu/luci-app-smartdns.git package/luci-app-smartdns
          retry git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/community/luci-theme-argon
          retry git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/community/luci-app-argon-config

          # =========================================================
          # 【架构师级外科手术】：克隆 autoupdate 并进行底层逻辑修补
          # =========================================================
          log_i "克隆 autoupdate 自动更新插件源码..."
          retry git clone --depth 1 https://github.com/Hyy2001X/AutoBuild-Packages.git package/AutoBuild-Packages
          mv package/AutoBuild-Packages/luci-app-autoupdate package/community/ 2>/dev/null || true
          mv package/AutoBuild-Packages/autoupdate package/community/ 2>/dev/null || true
          rm -rf package/AutoBuild-Packages
          
          log_i "🔧 正在对 autoupdate 脚本进行底层逻辑修补..."
          AUTO_SCRIPT="package/community/autoupdate/files/bin/autoupdate"
          if [ -f "$AUTO_SCRIPT" ]; then
              # 1. 修复原作者的正则僵化症：强制兼容官方标准的 x86-64 格式
              sed -i 's/x86_64/x86-64/g' "$AUTO_SCRIPT"
              
              # 2. 延长超时时间，给 Passwall HTTPS 握手留足余量 (5秒 -> 30秒)
              sed -i 's/--timeout 5/--timeout 30/g' "$AUTO_SCRIPT"
              sed -i 's/--timeout 10/--timeout 30/g' "$AUTO_SCRIPT"
              
              # 3. 铲除倒闭的 ghgo.xyz 死链
              sed -i 's|https://ghgo.xyz/||g' "$AUTO_SCRIPT"
              
              # 4. 【致命防御】：打断“云端套娃自残”机制！
              # 禁止它去网上下载未修补的残缺原版脚本覆盖自己，强制使用本地修补后的完美版本！
              sed -i 's/DOWNLOADER --path ${Tmp_Path} --file-name autoupdate.*/cp -f \/bin\/autoupdate ${Tmp_Path}\/autoupdate/g' "$AUTO_SCRIPT"
              
              log_i "✅ autoupdate 源码修补成功，已打造成完美契合官方底层的极客版本！"
          fi
          # =========================================================

          fix_rust() {
              local rust_dir="lang/rust"
              local raw_url="https://raw.githubusercontent.com/openwrt/packages/master/lang/rust"
              local files=("rust-package.mk" "rust-values.mk")
              local need_patch=0
              mkdir -p "$rust_dir"

              for f in "${files[@]}"; do
                  log_i "下载 Rust 支持文件: $f"
                  if curl -fL --retry 3 --connect-timeout 10 "$raw_url/$f" -o "$rust_dir/$f" && [ -s "$rust_dir/$f" ]; then
                      log_i "✅ 下载成功: $f"
                  else
                      log_w "⚠️ 下载失败或文件为空: $f"
                      need_patch=1
                      break
                  fi
              done

              if [ $need_patch -eq 1 ]; then
                  log_w "执行 Makefile 变量防断链注入..."
                  rm -rf "$rust_dir"
                  cp package/smartdns/Makefile package/smartdns/Makefile.bak
                  sed -i 's|^include \.\./\.\./lang/rust/rust-package\.mk|# include ../../lang/rust/rust-package.mk|' package/smartdns/Makefile
                  echo "RUST_TARGET_HOST:=" >> package/smartdns/Makefile
                  echo "RUST_TARGET_ARCH:=" >> package/smartdns/Makefile
                  echo "RUST_ARCH_DEPENDS:=" >> package/smartdns/Makefile
                  echo "RUSTC_VARS:=" >> package/smartdns/Makefile
                  echo "CARGO_PACKAGE_VARS:=" >> package/smartdns/Makefile
              fi
          }
          fix_rust

          log_i "5. 常规安装 feeds..."
          retry ./scripts/feeds install -a

          log_i "6. 🚀 强制提权：仅覆盖 Passwall UI..."
          ./scripts/feeds install -f -p passwall_luci -a

          [ -d feeds ] || log_e "feeds 目录不存在"
          [ -d package ] || log_e "package 目录不存在"
          log_i "✅ Feeds 处理完成，底层核心已成功解绑！"

      - name: Generate Configuration (配置解耦与探针注入)
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -euo pipefail

          log_i() { echo -e "\e[32m[INFO] $1\e[0m"; }
          
          # 1. 导入独立的基础配置清单
          cat ${{ github.workspace }}/x86_64.config > .config
          
          # 2. 运行 DIY Part 2 脚本
          SCRIPT="${{ github.workspace }}/diy-part2.sh"
          if [ -f "$SCRIPT" ]; then
              log_i "运行 DIY Part 2 脚本..."
              bash "$SCRIPT"
          fi
          
          # 3. 补全依赖配置
          make defconfig

          # ==============================================================================
          # 4. 【工业级流水线优化】：Hyy2001X 环境注入 (完美切分 底层指纹 与 UI标签)
          # ==============================================================================
          echo "🚀 启动 CI 级环境适配..."

          ROOT_FILES="${{ github.workspace }}/openwrt/files"
          mkdir -p "$ROOT_FILES/etc/AutoBuild"
          mkdir -p "$ROOT_FILES/etc/autoupdate"
          mkdir -p "$ROOT_FILES/usr/bin"

          if [ -z "${{ env.TAG_VERSION }}" ]; then
              echo "❌ 错误: TAG_VERSION 环境变量为空！请检查前置步骤。"
              exit 1
          fi

          cat <<EOF > "$ROOT_FILES/etc/autoupdate/default"
          Author="jphy1314"
          Github="https://github.com/${{ github.repository }}"
          # [底层指纹]：匹配真实文件名 openwrt-x86-64-generic...
          TARGET_PROFILE="x86-64"
          TARGET_BOARD="x86"
          TARGET_SUBTARGET="64"
          Firmware_Type="combined-efi.img.gz"
          # [UI 标签]：纯字母，绝对绕过前端严格正则校验
          TARGET_FLAG="x86"
          OP_VERSION="${{ env.TAG_VERSION }}"
          OP_AUTHOR="jphy1314"
          OP_BRANCH="master"
          OP_REPO="https://github.com/${{ github.repository }}"
          EOF

          cp "$ROOT_FILES/etc/autoupdate/default" "$ROOT_FILES/etc/autoupdate/custom"
          cp "$ROOT_FILES/etc/autoupdate/default" "$ROOT_FILES/etc/AutoBuild/Github_Variable"
          cp "$ROOT_FILES/etc/autoupdate/default" "$ROOT_FILES/etc/openwrt_info"

          cat <<EOF > "$ROOT_FILES/etc/openwrt_release"
          DISTRIB_ID='OpenWrt'
          DISTRIB_RELEASE='${{ env.TAG_VERSION }}'
          DISTRIB_REVISION='${{ env.CURRENT_DATE }}'
          DISTRIB_TARGET='x86/64'
          DISTRIB_ARCH='x86_64'
          DISTRIB_DESCRIPTION='OpenWrt by jphy1314'
          EOF

          ln -sf /bin/autoupdate "$ROOT_FILES/usr/bin/autoupdate"
          find "$ROOT_FILES" -type f -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          find "$ROOT_FILES" -type f -exec chmod 644 {} +

          echo "✅ 环境适配完成: 版本号 ${{ env.TAG_VERSION }} 已注入。"
          # ==============================================================================
          
          # 5. 开启 CCACHE 优化
          if ! grep -q "CONFIG_CCACHE=y" .config; then
              echo -e "\nCONFIG_DEVEL=y\nCONFIG_CCACHE=y" >> .config
          fi

      - name: Download Package Dependencies
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -euo pipefail

          log_i() { echo -e "\e[32m[INFO] $1\e[0m"; }
          log_w() { echo -e "\e[33m[WARN] $1\e[0m"; }
          log_e() { echo -e "\e[31m[ERROR] $1\e[0m"; exit 1; }

          retry() {
            local n=3
            for i in $(seq 1 $n); do
              if "$@"; then return 0; fi
              log_w "命令失败，重试 $i/$n: $*"
              sleep 5
            done
            log_e "命令失败已达最大重试次数: $*"
          }

          mkdir -p dl

          if [ -d "dl/go-mod-cache" ] && [ -n "$(find dl/go-mod-cache -mindepth 1 -type f -print -quit 2>/dev/null)" ]; then
            log_w "检测到非空的旧版 Go 模块缓存，正在强制清理以确保依赖纯净..."
            rm -rf dl/go-mod-cache || true
          fi

          log_i "清理下载残留临时文件..."
          find dl \( -name "*.tmp*" -o -name "*.partial*" -o -name "*.hash*" \) -print0 2>/dev/null | xargs -0 rm -f || true

          log_i "🚀 开始第一轮并行下载 (8线程)..."
          make download -j8 CONFIG_CCACHE= || log_w "部分源码包并行下载失败，准备进入精细化处理阶段"

          log_i "正在扫描并清理损坏的微型压缩包 (小于1KB)..."
          broken_count=$(find dl -type f -size -1024c \( -name "*.tar.*" -o -name "*.tgz" -o -name "*.zip" -o -name "*.bz2" \) | wc -l)
          
          if [ "$broken_count" -gt 0 ]; then
            log_w "清理了 $broken_count 个异常文件 (可能是 404/502 错误页面)，准备重试..."
            find dl -type f -size -1024c \( -name "*.tar.*" -o -name "*.tgz" -o -name "*.zip" -o -name "*.bz2" \) -delete
          else
            log_i "未发现损坏的压缩包，环境健康。"
          fi

          log_i "🛠️ 开始最终单线程补漏下载 (带重试)..."
          retry make download -j1 V=s CONFIG_CCACHE=

          log_i "✅ 所有依赖准备就绪，即将进入编译阶段"

      - name: Compile the Firmware
        id: compile
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -uo pipefail
          
          mkdir -p ${{ env.CCACHE_DIR }}
          chmod 755 ${{ env.CCACHE_DIR }}
          
          export CCACHE_DIR=${{ env.CCACHE_DIR }}
          export CCACHE_COMPILERCHECK=content
          export CCACHE_BASEDIR=${{ github.workspace }}
          export CCACHE_NOHASHDIR=true
          
          ccache -z
          ccache --set-config=max_size=10G
          export GOMEMLIMIT=5GiB
          
          echo "🚀 Starting Main Build with $(nproc) threads..."
          make -j$(nproc) CCACHE_DIR=${{ env.CCACHE_DIR }} || make -j1 V=s CCACHE_DIR=${{ env.CCACHE_DIR }}
          
          ccache -s
          echo "ℹ️ Final Cache Directory Size: $(du -sh ${{ env.CCACHE_DIR }} | cut -f1)"
          
          if [ -d "bin/targets" ] && [ "$(ls -A bin/targets 2>/dev/null)" ]; then
              echo "✅ Compile success!"
              echo "status=success" >> $GITHUB_OUTPUT
          else
              echo "❌ Compile failed. No firmware found."
              echo "status=failed" >> $GITHUB_OUTPUT
              exit 1
          fi
          
          DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -E 's/.*DEVICE_(.*)=y/\1/' | head -n1 | tr -d '[:space:]' || echo "Generic")
          if [ -n "$DEVICE" ]; then
              echo "DEVICE_NAME=_$DEVICE" >> $GITHUB_ENV
          else
              echo "DEVICE_NAME=_Generic" >> $GITHUB_ENV
          fi
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      # ==============================================================================
      # 【企业级可观测性】：如果编译崩溃，自动提取包含详细报错信息的黑匣子日志
      # ==============================================================================
      - name: Upload build logs on failure (崩溃黑匣子)
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: OpenWrt_Compile_Logs_${{ steps.cache-vars.outputs.date }}
          path: openwrt/logs/
          retention-days: 3

      - name: Upload Bin Directory
        uses: actions/upload-artifact@v6
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin
          retention-days: 3

      - name: Organize Files (Dynamic Path)
        id: organize
        working-directory: ${{ github.workspace }}/openwrt   # 【核心修复】：明确指定进入 openwrt 厨房找菜！
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        run: |
          set -euo pipefail
          
          RAW_DEVICE="${DEVICE_NAME#_}"
          TARGET_DIR=$(find bin/targets -mindepth 2 -maxdepth 2 -type d -name "*${RAW_DEVICE}*" | head -n 1 || true)
          
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -n 1 || true)
          fi
          
          if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            rm -rf packages || true
            find . -type f -name "*.buildinfo" -delete
            find . -type f -name "*.manifest" -delete
            echo "FIRMWARE=$PWD" >> $GITHUB_ENV
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Cannot find target firmware directory!"
            exit 1
          fi

      - name: Upload Firmware Directory
        uses: actions/upload-artifact@v6
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 3

      - name: Generate Release Tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          TAG_NAME="${{ env.TAG_VERSION }}"
          echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          touch release.txt
          echo "📦 固件发布版本: ${TAG_NAME}" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      #[纯原生重构] 极速创建发布并上传固件 (防冲突 + 动态时间戳标题)
      - name: Upload Firmware to Release
        if: env.TAG_VERSION != '' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          TAG="${{ env.TAG_VERSION }}"
          BUILD_TIME=$(date +'%H:%M')
          RELEASE_TITLE="${TAG} (编译时间: ${BUILD_TIME})"
          
          echo "🚀 开始上传固件到 Release [ ${TAG} ] ..."
          
          if [ -z "$(ls -A ${{ env.FIRMWARE }} 2>/dev/null)" ]; then
            echo "❌ 错误: 未发现待上传的固件文件！"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⚠️ 发现同名 Release [$TAG] 已存在，执行资产覆盖更新..."
            gh release upload "$TAG" ${{ env.FIRMWARE }}/* --clobber
            gh release edit "$TAG" --title "$RELEASE_TITLE"
            echo "✅ 资产追加/覆盖成功！Release 标题已刷新为: $RELEASE_TITLE"
          else
            echo "🆕 发现全新版本，正在创建新的 Release [$TAG] ..."
            gh release create "$TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release.txt \
              ${{ env.FIRMWARE }}/*
            echo "✅ 全新 Release 创建及固件上传成功！"
          fi

      # [纯原生重构] 替代弃更的 Mattraks/delete-workflow-runs
      - name: Delete Old Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "开始清理过旧的 Workflow 运行记录，仅保留最新 2 个..."
          gh run list --workflow "${{ github.workflow }}" --limit 100 --json databaseId -q '.[].databaseId' | tail -n +3 | while IFS= read -r run_id; do
            if [ -n "$run_id" ]; then
              echo "🗑️ 正在删除冗余运行记录: $run_id"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$run_id" --silent || true
            fi
          done
          echo "✅ Action 运行记录清理完成！"

      # 自动清理历史 Release 记录 (企业级原生方案)
      - name: Remove Old Releases
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "开始清理过旧的 Releases，仅保留最新 3 个..."
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName -q '.[].tagName' | tail -n +4 | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "🗑️ 正在删除旧版本: $tag"
              gh release delete "$tag" --cleanup-tag -y || true
            fi
          done
          echo "✅ 清理完成！"
