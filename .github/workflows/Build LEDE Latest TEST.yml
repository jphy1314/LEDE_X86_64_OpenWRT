name: Build LEDE Latest TEST
on:
  workflow_dispatch:

# [优化]: 并发控制，自动取消排队或正在运行的旧任务，节省运算时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  UPLOAD_BIN_DIR: "false"
  UPLOAD_FIRMWARE: "true"
  UPLOAD_RELEASE: "true"
  # CCACHE 统一挂载路径
  CCACHE_DIR: "/home/runner/.ccache"
  # [修复 Node20 警告] 强制所有底层 Action 使用 Node.js 24 运行
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    # [优化]: 全局超时熔断，防止编译死锁耗尽 GitHub 免费额度 (5小时)
    timeout-minutes: 300 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 释放 GitHub Runner 的磁盘空间，OpenWrt 编译通常需要 30GB+ 空间
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          
          # 仅清理占用极大的 .NET、Android SDK、Haskell 和 CodeQL 环境，释放超 20GB 空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          
          # 正常更新软件源
          sudo apt-get update
          
          # Ubuntu 24.04 专属包名修正：7zip, libgmp-dev, python3-setuptools
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake device-tree-compiler \
            flex gawk gcc-multilib g++-multilib gettext git gperf \
            help2man intltool libelf-dev libglib2.0-dev \
            libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev \
            ninja-build 7zip patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            bzip2 curl genisoimage haveged ccache libc6-dev-i386
            
          sudo apt-get autoremove --purge -y
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"
          
      - name: Clone Source Code
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # 仅拉取单分支、最新一次 commit，极大减少 git clone 时间
          git clone -b $REPO_BRANCH --single-branch --depth 1 $REPO_URL openwrt

      - name: Generate Cache Key Variables
        id: cache-vars
        run: |
          set -euo pipefail
          # 生成按天计算的时间戳，保证每天至少有一次全量/增量 Cache 刷新
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      # 【企业级缓存策略】
      # 缓存键由 分支名 + 核心配置文件的 Hash + 日期 组成。
      # 任何本地工作流文件或 feeds 列表的改动都会生成全新 Key，避免读取失效缓存导致玄学报错。
      - name: Cache Ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-lede-${{ env.REPO_BRANCH }}-${{ hashFiles('.github/workflows/*.yml', 'diy-part1.sh', 'diy-part2.sh', 'openwrt/feeds.conf.default') }}-${{ steps.cache-vars.outputs.date }}
          restore-keys: |
            ccache-lede-${{ env.REPO_BRANCH }}-${{ hashFiles('.github/workflows/*.yml', 'diy-part1.sh', 'diy-part2.sh', 'openwrt/feeds.conf.default') }}-
            ccache-lede-${{ env.REPO_BRANCH }}-

      - name: Load Custom Feeds (DIY Part 1)
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -euo pipefail
          SCRIPT="${{ github.workspace }}/diy-part1.sh"
          # 统一脚本调用风格。如果脚本不存在，|| true 防止报错中断
          [[ -f "$SCRIPT" ]] && bash "$SCRIPT" || true

      - name: Update, Patch & Install Feeds
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          log_i(){ echo -e "\e[32m[INFO] $1\e[0m"; }
          log_w(){ echo -e "\e[33m[WARN] $1\e[0m"; }
          log_e(){ echo -e "\e[31m[ERR ] $1\e[0m"; exit 1; }

          retry() {
              local n=3
              for i in $(seq 1 $n); do
                  if "$@"; then return 0; fi
                  log_w "命令失败，重试 $i/$n: $*"
                  sleep 5
              done
              log_e "命令失败已达最大重试次数: $*"
          }

          # ----------------------------
          # 【核心架构】：将所有冲突包（主程序+底层组件）合并，实施全量降维打击
          # ----------------------------
          CONFLICT_PKGS=(
              xray-core v2ray-geodata sing-box chinadns-ng dns2socks hysteria
              ipt2socks microsocks naiveproxy shadowsocks-libev shadowsocks-rust
              shadowsocksr-libev simple-obfs tcping trojan-plus tuic-client
              v2ray-plugin xray-plugin geoview shadow-tls
              smartdns luci-app-smartdns
              luci-theme-argon luci-app-argon-config
              luci-app-passwall passwall luci-app-passwall2
          )

          # 1. 更新 feeds
          log_i "1. 更新 feeds (拉取全局基础数据)"
          retry ./scripts/feeds update -a

          # ----------------------------
          # 2. 彻底扫荡冲突包（无视深度、双引擎解剖、严格护盾）
          # ----------------------------
          log_i "2. 扫荡老旧冲突包 (强制切断官方依赖链，确立新源的绝对唯一性)..."
          for pkg in "${CONFLICT_PKGS[@]}"; do
              # 【防注入装甲】
              safe_pkg=$(printf '%s\n' "$pkg" | sed 's/[][\\.*^$()+?{}\|]/\\&/g')

              # ==========================================
              # 范围 A: 扫荡 package/ (清理 Lean 本地硬编码)
              # ==========================================
              while IFS= read -r -d '' dir; do
                  rm -rf "$dir"
              done < <(find package/ -type d -name "$pkg" -print0 2>/dev/null || true)
              
              while IFS= read -r -d '' makefile; do
                  if grep -q -E "^[[:space:]]*PKG_NAME[[:space:]]*:?=[[:space:]]*${safe_pkg}[[:space:]]*$" "$makefile" 2>/dev/null; then
                      rm -rf "$(dirname "$makefile")"
                  fi
              done < <(find package/ -type f -name "Makefile" -print0 2>/dev/null || true)

              # ==========================================
              # 范围 B: 扫荡 feeds/ (清理官方源旧包)
              # ==========================================
              while IFS= read -r -d '' dir; do
                  # 🛡️ 绝对护盾：严格避开我们拉取的 Passwall 新源目录
                  if [[ "$dir" == *passwall_packages* ]] || [[ "$dir" == *passwall_luci* ]]; then 
                      continue
                  fi
                  rm -rf "$dir"
              done < <(find feeds/ -type d -name "$pkg" -print0 2>/dev/null || true)

              while IFS= read -r -d '' makefile; do
                  # 🛡️ 绝对护盾：严格避开我们拉取的 Passwall 新源 Makefile
                  if [[ "$makefile" == *passwall_packages* ]] || [[ "$makefile" == *passwall_luci* ]]; then 
                      continue
                  fi
                  if grep -q -E "^[[:space:]]*PKG_NAME[[:space:]]*:?=[[:space:]]*${safe_pkg}[[:space:]]*$" "$makefile" 2>/dev/null; then
                      rm -rf "$(dirname "$makefile")"
                  fi
              done < <(find feeds/ -type f -name "Makefile" -print0 2>/dev/null || true)
          done

          # ----------------------------
          # 3. 克隆最新社区插件
          # ----------------------------
          log_i "3. 克隆社区专属插件..."
          mkdir -p package/community
          retry git clone --depth 1 https://github.com/pymumu/openwrt-smartdns.git package/smartdns
          retry git clone --depth 1 https://github.com/pymumu/luci-app-smartdns.git package/luci-app-smartdns
          retry git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/community/luci-theme-argon
          retry git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/community/luci-app-argon-config

          # ----------------------------
          # 4. 解决 SmartDNS Rust 依赖问题
          # ----------------------------
          fix_rust() {
              local rust_dir="lang/rust"
              local raw_url="https://raw.githubusercontent.com/openwrt/packages/master/lang/rust"
              local files=("rust-package.mk" "rust-values.mk")
              local need_patch=0
              mkdir -p "$rust_dir"

              for f in "${files[@]}"; do
                  log_i "下载 Rust 支持文件: $f"
                  if curl -fL --retry 3 --connect-timeout 10 "$raw_url/$f" -o "$rust_dir/$f" && [ -s "$rust_dir/$f" ]; then
                      log_i "✅ 下载成功: $f"
                  else
                      log_w "⚠️ 下载失败或文件为空: $f"
                      need_patch=1
                      break
                  fi
              done

              if [ $need_patch -eq 1 ]; then
                  log_w "执行 Makefile 变量防断链注入..."
                  rm -rf "$rust_dir"
                  cp package/smartdns/Makefile package/smartdns/Makefile.bak
                  sed -i 's|^include \.\./\.\./lang/rust/rust-package\.mk|# include ../../lang/rust/rust-package.mk|' package/smartdns/Makefile
                  echo "RUST_TARGET_HOST:=" >> package/smartdns/Makefile
                  echo "RUST_TARGET_ARCH:=" >> package/smartdns/Makefile
                  echo "RUST_ARCH_DEPENDS:=" >> package/smartdns/Makefile
                  echo "RUSTC_VARS:=" >> package/smartdns/Makefile
                  echo "CARGO_PACKAGE_VARS:=" >> package/smartdns/Makefile
              fi
          }
          fix_rust

          # ----------------------------
          # 5. 常规安装 feeds，建立基础依赖链
          # ----------------------------
          log_i "5. 安装 feeds..."
          retry ./scripts/feeds install -a

          # ----------------------------
          # 6. 【核心提权】强制安装 Passwall 专属源，覆盖旧版
          # ----------------------------
          log_i "6. 🚀 强制提权并覆写依赖..."
          ./scripts/feeds install -f -p passwall_packages -a
          ./scripts/feeds install -f -p passwall_luci -a

          # ----------------------------
          # 完整性检查
          # ----------------------------
          [ -d feeds ] || log_e "feeds 目录不存在"
          [ -d package ] || log_e "package 目录不存在"

          log_i "✅ Feeds 处理完成，依赖树完整，旧版软链接已被彻底切断！"

      - name: Load Custom Configuration (DIY Part 2)
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -euo pipefail
          SCRIPT="${{ github.workspace }}/diy-part2.sh"
          # 统一执行风格：基于 OpenWrt 根目录执行
          [[ -f "$SCRIPT" ]] && bash "$SCRIPT" || true

      - name: Generate Configuration
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -euo pipefail
          
          # 【模块化配置注入 (Configuration as Code)】
          # 分块写入，避免单体文件过长，极大地提高后期维护性和可读性
          
          #[模块 1]: 基础架构与编译选项 (开启 Ccache，关闭无用 Debug 减小固件体积)
          cat >> .config <<'EOF'
          CONFIG_TARGET_OPTIMIZATION="-O2 -pipe -march=bonnell -mtune=bonnell -fomit-frame-pointer"
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_DEBUG=n
          CONFIG_DEBUG_INFO=n
          CONFIG_COLLECT_KERNEL_DEBUG=n
          CONFIG_STRIP_KERNEL_EXPORTS=y
          CONFIG_SDK=n
          CONFIG_IB=n
          CONFIG_KO_SYMBOLS=n
          CONFIG_BUILD_LOG=n
          EOF
          
          # [模块 2]: 防火墙核心与兼容层 (fw4 + nftables + iptables-nft)
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_firewall=n
          CONFIG_PACKAGE_iptables=n
          CONFIG_PACKAGE_libiptc=n
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_ip6tables-nft=y
          CONFIG_PACKAGE_kmod-nft-core=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-fib=y
          CONFIG_PACKAGE_kmod-nft-dict=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
          CONFIG_PACKAGE_iptables-mod-socket=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_kmod-ipt-tproxy=y
          CONFIG_PACKAGE_kmod-ipt-extra=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-nat6=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_kmod-ipt-ipset=y
          EOF
          
          # [模块 3]: DNS 解析器支持 (双集并存)
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_dnssec=y
          CONFIG_PACKAGE_dnsmasq_full_auth=y
          CONFIG_PACKAGE_dnsmasq_full_ipset=y
          CONFIG_PACKAGE_dnsmasq_full_conntrack=y
          CONFIG_PACKAGE_dnsmasq_full_noid=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y
          EOF
          
          # [模块 4]: 核心应用与 Passwall 代理模块
          cat >> .config <<'EOF'
          CONFIG_XRAY_CORE_COMPRESS_UPX=n
          CONFIG_SING_BOX_COMPRESS_UPX=n
          CONFIG_PACKAGE_xray-core_compress_upx=n
          CONFIG_PACKAGE_sing-box_compress_upx=n
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Iptables=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Nftables=y
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y
          CONFIG_PACKAGE_hysteria=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-app-ipsec-vpnd=y
          CONFIG_PACKAGE_luci-app-usb-printer=y
          CONFIG_PACKAGE_luci-app-autoreboot=y
          CONFIG_PACKAGE_luci-app-filetransfer=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_LUCI_THEME="argon"
          EOF
          
          # [模块 5]: 硬件加速与高级磁盘优化组件 (由 DIY Part 2 需求引入解耦)
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_fstrim=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_blockd=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_kmod-fs-xfs=y
          CONFIG_PACKAGE_kmod-nvme=y
          CONFIG_PACKAGE_libblkid=y
          CONFIG_PACKAGE_libuuid=y
          CONFIG_PACKAGE_uci=y
          
          # 显式锁定硬盘休眠底层引擎与驱动工具，防止 UI 被静默剔除
          CONFIG_PACKAGE_luci-app-hd-idle=y
          CONFIG_PACKAGE_hd-idle=y
          CONFIG_PACKAGE_hdparm=y
          EOF

          #[模块 6]: 监控与统计组件
          cat >> .config <<'EOF'
          # 极简实时网速表格 (状态 -> 流量监控)
          CONFIG_PACKAGE_luci-app-wrtbwmon=y
          # 精准流量饼图与占比分析 (强烈推荐)
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          # 顶级酷炫仪表盘前端 (适合 x86 高性能软路由)
          CONFIG_PACKAGE_luci-app-netdata=y
          EOF

          # [模块 7]: NAS 文件共享服务 (纯血 Samba4)
          cat >> .config <<'EOF'
          # 1. 彻底卸载内核级 ksmbd、老旧的 samba36 以及 Lean 专属的有冲突的 autosamba
          CONFIG_PACKAGE_luci-app-ksmbd=n
          CONFIG_PACKAGE_ksmbd-server=n
          CONFIG_PACKAGE_kmod-fs-ksmbd=n
          CONFIG_PACKAGE_luci-app-samba=n
          CONFIG_PACKAGE_samba36-server=n
          CONFIG_PACKAGE_autosamba=n
          # 2. 安装企业级 Samba4 主程序与界面
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_samba4-libs=y
          CONFIG_PACKAGE_samba4-server=y
          # 3. 增强组件：让路由器在 Windows "网络" 邻居中自动出现
          CONFIG_PACKAGE_wsdd2=y
          # 4. 增强组件：支持苹果 macOS Time Machine (时间机器备份)
          CONFIG_PACKAGE_samba4-server-vfs=y
          EOF
          
          # 生成全量默认配置
          make defconfig
          
          # 最后防线：确保 CCACHE 未被 defconfig 冲掉
          if ! grep -q "CONFIG_CCACHE=y" .config; then
             echo "CONFIG_DEVEL=y" >> .config
             echo "CONFIG_CCACHE=y" >> .config
          fi

      - name: Download Package Dependencies
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          mkdir -p dl
          
          # 【修复核心】: 附加 CONFIG_CCACHE= 覆盖 .config，禁止 ccache 在下载阶段越权报错
          # 并发下载，允许个别失败
          make download -j8 CONFIG_CCACHE= || true
          
          # 关键清理步骤：删除因 404/网络问题产生的损坏小文件（小于1KB通常是错误页面）
          find dl -type f -size -1024c -exec rm -f {} \;
          
          # 单线程强力查漏补缺，打印详细信息
          make download -j1 V=s CONFIG_CCACHE=

      - name: Compile the Firmware
        id: compile
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -uo pipefail # 此处不设置 -e，是为了允许并发 make 失败后自动触发单线程 fallback 编译
          
          # 安全创建 Ccache 目录，使用 755 权限符合企业安全基线
          mkdir -p ${{ env.CCACHE_DIR }}
          chmod 755 ${{ env.CCACHE_DIR }}
          
          # [核心 CCACHE 优化]
          export CCACHE_DIR=${{ env.CCACHE_DIR }}
          export CCACHE_COMPILERCHECK=content
          # CCACHE_BASEDIR 使得构建缓存对绝对路径不敏感，极大地提高缓存命中率
          export CCACHE_BASEDIR=${{ github.workspace }}/openwrt
          
          ccache -z
          # 根据 GitHub Runner 磁盘配额，最大化缓存池，预防老旧缓存被频繁剔除
          ccache --set-config=max_size=50G
          
          echo "🚀 Starting Main Build with $(nproc) threads..."
          # 并行构建时显式传入 CCACHE_DIR 变量，防止部分 Makefile 内部重写路径
          make -j$(nproc) CCACHE_DIR=${{ env.CCACHE_DIR }} || make -j1 V=s CCACHE_DIR=${{ env.CCACHE_DIR }}
          
          ccache -s
          echo "ℹ️ Final Cache Directory Size: $(du -sh ${{ env.CCACHE_DIR }} | cut -f1)"
          
          # 编译成功判定：修复 if 和[ 的间距，抑制 ls 的 stderr 报错
          if [ -d "bin/targets" ] && [ "$(ls -A bin/targets 2>/dev/null)" ]; then
             echo "✅ Compile success!"
             echo "status=success" >> $GITHUB_OUTPUT
          else
             echo "❌ Compile failed. No firmware found."
             echo "status=failed" >> $GITHUB_OUTPUT
             exit 1
          fi
          
          # 设备名提取：使用 -E 替代 -r 提高兼容性，过滤空格与换行，加 || true 防止 grep 失败引起流水线崩溃
          DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -E 's/.*DEVICE_(.*)=y/\1/' | head -n1 | tr -d '[:space:]' || echo "Generic")
          if [ -n "$DEVICE" ]; then
             echo "DEVICE_NAME=_$DEVICE" >> $GITHUB_ENV
          else
             echo "DEVICE_NAME=_Generic" >> $GITHUB_ENV
          fi
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Upload Bin Directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin
          # [优化]: 限制中间产物保留 3 天，防止 GitHub 免费存储空间爆仓
          retention-days: 3

      - name: Organize Files (Dynamic Path)
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        run: |
          set -euo pipefail
          
          # 提取纯净设备名称 (如 x86_64) 用于通配符搜索
          RAW_DEVICE="${DEVICE_NAME#_}"
          
          # 健壮的固件发现策略：优先精确匹配包含该设备名的目录结构
          TARGET_DIR=$(find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d -name "*${RAW_DEVICE}*" | head -n 1 || true)
          
          # 如果设备名匹配失败（可能是 generic 这种无特征词汇），退化为抓取第一个有效目录
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d | head -n 1 || true)
          fi
          
          if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            # 清理占空间的 packages 包夹
            rm -rf packages || true
            echo "FIRMWARE=$PWD" >> $GITHUB_ENV
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Cannot find target firmware directory!"
            exit 1
          fi

      - name: Upload Firmware Directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          # [优化]: 限制中间产物保留 3 天
          retention-days: 3

      - name: Generate Release Tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          # 增加业务前缀 'LEDE_' 并携带 DEVICE_NAME，彻底杜绝不同平台编译在同一时间产生的 Tag 相互覆盖
          echo "release_tag=LEDE_$(date +"%Y.%m.%d-%H%M")${{ env.DEVICE_NAME }}" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      # [纯原生重构] 替代软瘫的 softprops/action-gh-release，极速创建发布并上传固件
      - name: Upload Firmware to Release
        if: steps.tag.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "🚀 开始使用 GitHub CLI 创建 Release 并上传固件..."
          gh release create "${{ steps.tag.outputs.release_tag }}" \
            --title "${{ steps.tag.outputs.release_tag }}" \
            --notes-file release.txt \
            ${{ env.FIRMWARE }}/*
          echo "✅ Release 创建及固件上传成功！"

      # [纯原生重构] 替代弃更的 Mattraks/delete-workflow-runs，自动清理历史运行记录
      - name: Delete Old Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "开始清理过旧的 Workflow 运行记录，仅保留最新 2 个..."
          
          # 利用 jq JSON 引擎健壮提取 ID，并调用 GitHub 原生 API 进行静默删除
          gh run list --workflow "${{ github.workflow }}" --limit 100 --json databaseId -q '.[].databaseId' | tail -n +3 | while IFS= read -r run_id; do
            if [ -n "$run_id" ]; then
              echo "🗑️ 正在删除冗余运行记录: $run_id"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$run_id" --silent || true
            fi
          done
          echo "✅ Action 运行记录清理完成！"

      # 自动清理历史 Release 记录 (企业级原生方案，彻底剔除已废弃的第三方依赖)
      - name: Remove Old Releases
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "开始清理过旧的 Releases，仅保留最新 3 个..."
          # 使用 JSON 输出获取所有 tag（免疫一切特殊字符的健壮提取法）
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName -q '.[].tagName' | tail -n +4 | while IFS= read -r tag; do
            # 严格保留空格，防止 Exit code 2 报错
            if [ -n "$tag" ]; then
              echo "🗑️ 正在删除旧版本: $tag"
              gh release delete "$tag" --cleanup-tag -y || true
            fi
          done
          echo "✅ 清理完成！"
